<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Palindrome Checker</h1>
        <div>
            <input id="text-input" type="text" placeholder="Type your word here..."></input>
            <button id="check-btn">Check for palindromicity</button>
        </div>
        <div>
            <div id="result"></div>
        </div>
        <div>
            <p id="explanation"> A palindrome is a word, phrase, or sequence that reads the same backward as forward.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
