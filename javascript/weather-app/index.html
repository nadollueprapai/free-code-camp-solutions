<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Report</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Weather Report</h1>
    <div class="card">
        <div>
            <button id="get-weather-btn">Get Weather</button>
            <select id="city-select">
                <option value=""></option>
                <option value="new york">New York</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="paris">Paris</option>
                <option value="tokyo">Tokyo</option>
                <option value="london">London</option>
            </select>
        </div>
        <div id="weather-display-card" class="card">
            <div>Location: <span id="location"></span></div>
            <img id="weather-icon" src="">
            <h2 id="weather-main"></h2>
            <div>Main Temperature: <span id="main-temperature"></span></div>
            <div>Feels Like: <span id="feels-like"></span></div>
            <div>Humidity: <span id="humidity"></span></div>
            <div>Wind Speed: <span id="wind"></span></div>
            <div>Wind Gust: <span id="wind-gust"></span></div>
        </div>
    </div>
    <footer>
        <h3>Weather Report App By Nadol Lueprapai</h3>
        <p>Built as part of the freeCodeCamp curriculum.</p>
    </footer>
</body>

<script src="script.js"></script>

</html>
