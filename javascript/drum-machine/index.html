<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Drum Machine</h1>
    <div id="drum-machine">
        <div id="pad-bank">
            <button class="drum-pad" id="Heater-1.mp3">Q
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" type="audio/mpeg"
                    id="Q">
                </audio>
            </button>
            <button class="drum-pad" id="Heater-2.mp3">W
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" type="audio/mpeg"
                    id="W">
                </audio>
            </button>
            <button class="drum-pad" id="Heater-3.mp3">E
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" type="audio/mpeg"
                    id="E">
                </audio>
            </button>
            <button class="drum-pad" id="Heater-4_1.mp3">A
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" type="audio/mpeg"
                    id="A">
                </audio>
            </button>
            <button class="drum-pad" id="Heater-6.mp3">S
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" type="audio/mpeg"
                    id="S">
                </audio>
            </button>
            <button class="drum-pad" id="Dsc_Oh.mp3">D
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" type="audio/mpeg"
                    id="D">
                </audio>
            </button>
            <button class="drum-pad" id="Kick_n_Hat.mp3">Z
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" type="audio/mpeg"
                    id="Z">
                </audio>
            </button>
            <button class="drum-pad" id="RP4_KICK_1.mp3">X
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" type="audio/mpeg"
                    id="X">
                </audio>
            </button>
            <button class="drum-pad" id="Cev_H2.mp3">C
                <audio class="clip" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" type="audio/mpeg"
                    id="C">
                </audio>
            </button>
        </div>
        <p id="display">Click a button or press a key.</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
